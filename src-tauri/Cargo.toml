[package]
name = "contractorcrm"
version = "0.1.0"
description = "Local-first, AI-native CRM for contractors"
authors = ["ContractorKeith"]
edition = "2021"

[lib]
name = "contractorcrm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
rusqlite = { version = "0.40.2", features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = [] }
thiserror = "2.0.20"
uuid = { version = "1.24.0", features = ["serde", "v7"] }

[dev-dependencies]
tempfile = "3.27.0"
